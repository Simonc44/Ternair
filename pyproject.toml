[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ternair"
version = "0.6.0"
description = "Stand-alone BitNet b1.58-style ternary language model prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ternair contributors" }]
keywords = [
    "ternary",
    "bitnet",
    "b1.58",
    "1.58-bit",
    "transformer",
    "language-model",
    "quantization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.17",
]

[project.scripts]
ternair = "ternair.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ternair", "ternair.*"]
exclude = ["tests*", "tests.*"]

[tool.setuptools.package-data]
ternair = ["py.typed", "README.md"]
