name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package and dev tools
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest -q

      - name: Verify package build
        run: |
          python -m build

      - name: Smoke tests (CLI)
        shell: bash
        run: |
          echo "=== CLI help ==="
          python -m ternair --help
          echo "=== Config info ==="
          python -m ternair info --profile tiny
          echo "=== Size projection ==="
          python -m ternair size --profile tiny
          echo "=== Demo ==="
          python -m ternair demo --profile tiny --max-new-tokens 8
          echo "=== Train smoke ==="
          python -m ternair train-one --profile tiny --lr 1e-3
          echo "All smoke tests passed"

      - name: Test optional features (Linux, Python 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python scripts/test_ci.py
