name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package and dependencies
        run: |
          pip install -e src/ternair

      - name: Verify CLI help
        run: |
          python -m ternair --help

      - name: Verify configuration info (tiny profile)
        run: |
          python -m ternair info --profile tiny

      - name: Verify size projection (tiny profile)
        run: |
          python -m ternair size --profile tiny

      - name: Verify size projection (one_gb profile)
        run: |
          python -m ternair size --profile one_gb

      - name: Verify size projection with fit-one-gb
        run: |
          python -m ternair size --profile base --fit-one-gb

      - name: Run demo end-to-end (tiny profile)
        run: |
          python -m ternair demo --profile tiny --max-new-tokens 8

      - name: Run training smoke test
        run: |
          python -m ternair train-one --profile tiny --lr 1e-3

      - name: Run unit tests
        run: |
          pip install pytest
          python -m pytest tests/ --confcutdir=tests -v
