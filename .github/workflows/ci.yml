name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package and dependencies
        run: |
          pip install -e .

      - name: Install development tools
        run: |
          python -m pip install pytest build

      - name: Run unit tests
        run: |
          python -m pytest -q

      - name: Verify package build
        run: |
          python -m build

      - name: Run Ternair smoke tests (CLI + model)
        run: |
          echo "=== CLI help ==="
          python -m ternair --help
          echo "=== Config info ==="
          python -m ternair info --profile tiny
          echo "=== Size projection ==="
          python -m ternair size --profile tiny
          python -m ternair size --profile one_gb
          python -m ternair size --profile base --fit-one-gb
          echo "=== Demo (generate) ==="
          python -m ternair demo --profile tiny --max-new-tokens 8
          echo "=== Train smoke ==="
          python -m ternair train-one --profile tiny --lr 1e-3
          echo "All smoke tests passed"

      - name: Test optional features when dependencies are available
        if: matrix.python-version == '3.11'
        run: |
          python scripts/test_ci.py
