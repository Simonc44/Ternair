name: Benchmark WikiText-2

# Runs weekly on Sunday at 03:00 UTC, or manually via workflow_dispatch.
# After running, commits the updated benchmark table directly into README.md.

on:
  schedule:
    - cron: "0 3 * * 0"   # Every Sunday at 03:00 UTC
  workflow_dispatch:        # Manual trigger from the GitHub UI
    inputs:
      steps:
        description: "Training steps (default: 300)"
        required: false
        default: "300"
      profile:
        description: "Model profile: tiny | small"
        required: false
        default: "tiny"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit the updated README

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 2. Python + deps
      # ----------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ternair and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install datasets transformers torch --index-url https://download.pytorch.org/whl/cpu

      # ----------------------------------------------------------------
      # 3. Run the benchmark
      # ----------------------------------------------------------------
      - name: Run WikiText-2 benchmark
        env:
          STEPS: ${{ github.event.inputs.steps || '300' }}
          PROFILE: ${{ github.event.inputs.profile || 'tiny' }}
        run: |
          python scripts/benchmark_wikitext2.py \
            --steps $STEPS \
            --profile $PROFILE \
            --storage fastpacked \
            --device cpu \
            --seq-len 128 \
            --batch-size 2 \
            --eval-max-tokens 20000 \
            --speed-tokens 16 \
            --output benchmark_results.json \
            --output-md benchmark_results.md

      # ----------------------------------------------------------------
      # 4. Inject results into README.md
      # ----------------------------------------------------------------
      - name: Inject benchmark table into README
        run: |
          python - <<'PYEOF'
          import json, re, datetime, pathlib

          # --- Load results ---
          with open("benchmark_results.json") as f:
              results = json.load(f)

          cfg     = results["config"]
          models  = results["models"]
          t       = models.get("Ternair (ternary)", models.get("ternair", {}))
          fp      = models.get("FP16 baseline",     models.get("fp16",    {}))

          ppl_t   = t.get("perplexity",    float("nan"))
          ppl_fp  = fp.get("perplexity",   float("nan"))
          size_t  = t.get("size_mib",      0.0)
          size_fp = fp.get("size_mib",     0.0)
          spd_t   = t.get("tokens_per_sec", 0.0)
          spd_fp  = fp.get("tokens_per_sec", 0.0)
          params  = t.get("params",        0)

          ppl_delta   = ppl_t  - ppl_fp
          ppl_pct     = ppl_delta / max(ppl_fp, 0.001) * 100
          size_ratio  = size_fp / max(size_t, 0.001)
          speed_ratio = spd_t  / max(spd_fp, 0.001)
          run_date    = cfg.get("date", datetime.datetime.utcnow().isoformat(timespec="seconds"))
          steps       = cfg.get("steps", "?")
          device      = cfg.get("device", "cpu")
          profile     = cfg.get("profile", "tiny")
          storage     = cfg.get("storage", "fastpacked")

          table = f"""<!-- BENCHMARK_RESULTS -->
## Benchmark WikiText-2 — Ternair vs FP16

> Profile `{profile}` · storage `{storage}` · {steps} training steps · device `{device}`  
> {params:,} parameters · Last run: {run_date} (auto-generated by CI)

| Model | PPL ↓ | Size (MiB) ↓ | Tokens/sec ↑ |
|-------|------:|-------------:|-------------:|
| **Ternair (ternary)** | **{ppl_t:.2f}** | **{size_t:.1f}** | **{spd_t:.1f}** |
| FP16 baseline | {ppl_fp:.2f} | {size_fp:.1f} | {spd_fp:.1f} |

**Summary:**
- PPL overhead vs FP16: {ppl_delta:+.2f} ({ppl_pct:+.1f}%)
- Size compression: **{size_ratio:.1f}×**
- Speed ratio: {speed_ratio:.2f}×
<!-- END_BENCHMARK_RESULTS -->"""

          # --- Patch README ---
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")

          # Replace between markers if they exist, otherwise append
          pattern = r"<!-- BENCHMARK_RESULTS -->.*?<!-- END_BENCHMARK_RESULTS -->"
          if re.search(pattern, readme, flags=re.DOTALL):
              readme = re.sub(pattern, table, readme, flags=re.DOTALL)
          else:
              readme = readme + "\n\n" + table

          pathlib.Path("README.md").write_text(readme, encoding="utf-8")
          print("README.md patched successfully.")
          PYEOF

      # ----------------------------------------------------------------
      # 5. Commit & push
      # ----------------------------------------------------------------
      - name: Commit updated README and results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md benchmark_results.json benchmark_results.md
          # Only commit if something changed
          git diff --cached --quiet || git commit -m "ci(benchmark): auto-update WikiText-2 results [skip ci]"
          git push

      # ----------------------------------------------------------------
      # 6. Upload artifacts (optional — visible in Actions tab)
      # ----------------------------------------------------------------
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results.json
            benchmark_results.md
          retention-days: 90
