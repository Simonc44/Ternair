name: Benchmark WikiText-2

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: false
        default: "500"
      profile:
        description: "Model profile: tiny | small"
        required: false
        default: "tiny"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch CPU
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Ternair and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install datasets

      - name: Run WikiText-2 benchmark
        env:
          STEPS: ${{ github.event.inputs.steps || '500' }}
          PROFILE: ${{ github.event.inputs.profile || 'tiny' }}
        run: |
          python scripts/benchmark_wikitext2.py \
            --steps "$STEPS" \
            --profile "$PROFILE" \
            --storage fastpacked \
            --device cpu \
            --seq-len 128 \
            --batch-size 4 \
            --lr 3e-4 \
            --warmup-ratio 0.1 \
            --eval-max-tokens 20000 \
            --speed-seq-len 64 \
            --use-char-tokenizer \
            --output benchmark_results.json \
            --output-md benchmark_results.md

      - name: Inject benchmark table into README
        run: python scripts/inject_benchmark.py

      - name: Commit updated README and results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md benchmark_results.json benchmark_results.md
          git diff --cached --quiet || git commit -m "ci(benchmark): auto-update WikiText-2 results [skip ci]"
          git push

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results.json
            benchmark_results.md
          retention-days: 90
